  .hero-content { position: relative; z-index: 2; text-align: left; padding: 0 8vw; width: 100%; }
  .spaced { font-size: clamp(1.3rem, 4vw, 2.4rem); font-weight: 600; letter-spacing: 0.5em; text-transform: uppercase; margin: 0 0 20px; color: var(--text); }
  .caption { color: var(--text-dim); font-size: 0.92rem; max-width: 34ch; }
  .scroll-cue {
    position: absolute; bottom: 26px; left: 50%; transform: translateX(-50%); z-index: 2;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    color: var(--text-dim); font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.14em;
  }
  .scroll-cue svg { width: 14px; height: 14px; animation: bob 1.8s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { .scroll-cue svg { animation: none; } }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(5px); } }

  .below {
    position: relative; min-height: 100vh; min-height: 100dvh;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
    background: linear-gradient(180deg, var(--void-4) 0%, var(--void-4) 60%, var(--void-3) 100%);
  }
  .below + .below { background: linear-gradient(180deg, var(--void-3) 0%, var(--void-4) 60%, var(--void-3) 100%); }
  .below:last-of-type { background: linear-gradient(180deg, var(--void-3) 0%, var(--void-4) 40%, #010100 100%); }
  .below canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .below-content {
    position: absolute; top: 40px; left: 0; right: 0; z-index: 2; text-align: center; padding: 0 24px;
    opacity: 0; transform: translateY(10px); transition: opacity 0.9s ease, transform 0.9s ease;
  }
  .below-content.visible { opacity: 1; transform: translateY(0); }
  @media (prefers-reduced-motion: reduce) { .below-content { opacity: 1; transform: none; transition: none; } }
  .below .eyebrow { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.18em; color: var(--beam); margin-bottom: 10px; font-weight: 700; }
  .below h2 { font-size: clamp(1.3rem, 3vw, 1.7rem); font-weight: 600; margin: 0; color: var(--text); }

<section class="below" id="ringSect">
  <canvas id="ringCanvas"></canvas>
  <div class="below-content" id="ringText">
    <h2>Yıldızların izinde.</h2>
  </div>
</section>

<script>
(function () {
  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function makeCanvas(id) {
    var canvas = document.getElementById(id);
    var ctx = canvas.getContext("2d");
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = 0, h = 0;
    function resize() {
      var rect = canvas.parentElement.getBoundingClientRect();
      w = rect.width; h = rect.height;
      canvas.width = Math.floor(w * dpr); canvas.height = Math.floor(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize(); window.addEventListener("resize", resize);
    return { canvas: canvas, ctx: ctx, get w() { return w; }, get h() { return h; }, onResize: resize };
  }

  function revealController(sectionId, textId, onEnter) {
    var section = document.getElementById(sectionId);
    var textEl = document.getElementById(textId);
    var revealStart = null, running = false, raf = null;
    function loop(time) { onEnter.draw(time, revealStart); if (running) raf = requestAnimationFrame(loop); }
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) {
          if (revealStart === null) revealStart = performance.now();
          if (textEl) textEl.classList.add("visible");
          running = true;
          if (!raf) raf = requestAnimationFrame(loop);
          if (reduceMotion) { onEnter.draw(performance.now(), revealStart); running = false; }
        } else if (!reduceMotion) { running = false; if (raf) { cancelAnimationFrame(raf); raf = null; } }
      });
    }, { threshold: 0.1 });
    io.observe(section);
  }


  /* ================= Desert Ring (photo + starry glow + halo) ================= */
  (function () {
    var c = makeCanvas("ringCanvas");
    var w = 0, h = 0;
    var grains = [], stars = [];
    var mouse = { x: -9999, y: -9999, active: false };
    var linkDist = 120;

    c.canvas.addEventListener("pointermove", function (e) {
      var rect = c.canvas.getBoundingClientRect();
      mouse.x = e.clientX - rect.left; mouse.y = e.clientY - rect.top; mouse.active = true;
    });
    c.canvas.addEventListener("pointerleave", function () { mouse.active = false; });

    function resize() {
      w = c.w; h = c.h;
      grains = [];
      var count = Math.floor((w * h) / 11000);
      for (var i = 0; i < count; i++) {
        grains.push({ x: Math.random()*w, y: h*(0.1+Math.random()*0.5), s: Math.random()*1.1+0.3, vx: Math.random()*0.05+0.015, phase: Math.random()*Math.PI*2 });
      }
      stars = [];
      var starCount = Math.max(30, Math.floor((w*h*0.4)/9000));
      for (var s = 0; s < starCount; s++) {
        stars.push({ x: Math.random()*w, y: Math.random()*h*0.55, vx: (Math.random()-0.5)*0.05, vy: (Math.random()-0.5)*0.03, r: Math.random()*1.1+0.5, phase: Math.random()*Math.PI*2, delay: Math.random()*900 });
      }
    }
    resize();
    window.addEventListener("resize", resize);

    function drawStars(time, revealStart, intro) {
      var ctx = c.ctx;
      var elapsed = revealStart === null ? 0 : time - revealStart;
      stars.forEach(function (st) {
        var reveal = reduceMotion ? 1 : Math.max(0, Math.min(1, (elapsed - st.delay) / 700));
        if (!reduceMotion) {
          st.x += st.vx; st.y += st.vy;
          if (st.x < 0) st.x = w; if (st.x > w) st.x = 0;
          if (st.y < 0) st.y = h*0.55; if (st.y > h*0.55) st.y = 0;
        }
        st.alpha = reveal;
      });
      for (var i = 0; i < stars.length; i++) {
        for (var j = i+1; j < stars.length; j++) {
          var a = stars[i], b = stars[j];
          if (a.alpha<=0||b.alpha<=0) continue;
          var dx=a.x-b.x, dy=a.y-b.y;
          var dist = Math.sqrt(dx*dx+dy*dy);
          if (dist < linkDist) {
            var mDist = mouse.active ? Math.min(Math.hypot(a.x-mouse.x,a.y-mouse.y), Math.hypot(b.x-mouse.x,b.y-mouse.y)) : 9999;
            var boost = mDist < 170 ? (1-mDist/170)*0.75 : 0;
            var alpha = ((1-dist/linkDist)*0.1 + boost) * a.alpha * b.alpha;
            ctx.strokeStyle = "rgba(255,190,140," + alpha + ")";
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
          }
        }
      }
      stars.forEach(function (st) {
        if (st.alpha<=0) return;
        var mDist = mouse.active ? Math.hypot(st.x-mouse.x,st.y-mouse.y) : 9999;
        var boost = mDist < 110 ? (1-mDist/110)*0.6 : 0;
        var tw = reduceMotion ? 0.6 : Math.sin(time/1200+st.phase)*0.3+0.6;
        ctx.fillStyle = "rgba(255,232,205," + (Math.min(1,(tw*0.7+boost)) * st.alpha) + ")";
        ctx.beginPath(); ctx.arc(st.x, st.y, st.r + boost*1.3, 0, Math.PI*2); ctx.fill();
      });
    }

    var shooting = null;
    var nextShootTime = 2500 + Math.random() * 4000;

    function updateShootingStar(time) {
      if (reduceMotion) return;
      if (!shooting && time > nextShootTime) {
        var angle = Math.PI * 0.2 + Math.random() * 0.2;
        var speed = (w + h) * 0.0011 + Math.random() * (w + h) * 0.0004;
        shooting = {
          x: w * (0.08 + Math.random() * 0.55),
          y: h * Math.random() * 0.22,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          born: time,
          life: 650 + Math.random() * 350
        };
      }
      if (shooting && time - shooting.born > shooting.life) {
        shooting = null;
        nextShootTime = time + 4000 + Math.random() * 7000;
      }
    }

    function drawShootingStar(time) {
      if (!shooting) return;
      var ctx = c.ctx;
      var age = time - shooting.born;
      var t = age / shooting.life;
      var fade = Math.sin(Math.min(1, t) * Math.PI);
      var x = shooting.x + shooting.vx * age;
      var y = shooting.y + shooting.vy * age;
      var dirLen = Math.hypot(shooting.vx, shooting.vy) || 1;
      var ux = shooting.vx / dirLen, uy = shooting.vy / dirLen;
      var tailLen = Math.min(w, h) * 0.12;
      var tailX = x - ux * tailLen, tailY = y - uy * tailLen;

      var grad = ctx.createLinearGradient(tailX, tailY, x, y);
      grad.addColorStop(0, "rgba(255,236,214,0)");
      grad.addColorStop(1, "rgba(255,236,214," + (0.85 * fade) + ")");
      ctx.strokeStyle = grad;
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(tailX, tailY); ctx.lineTo(x, y); ctx.stroke();

      ctx.fillStyle = "rgba(255,246,235," + fade + ")";
      ctx.beginPath(); ctx.arc(x, y, 1.5, 0, Math.PI * 2); ctx.fill();
    }

    function draw(time, revealStart) {
      var ctx = c.ctx;
      ctx.clearRect(0, 0, w, h);
      var elapsed = revealStart === null ? 0 : time - revealStart;
      var intro = reduceMotion ? 1 : Math.max(0, Math.min(1, elapsed / 1200));

      drawStars(time, revealStart, intro);
      updateShootingStar(time);
      drawShootingStar(time);

      grains.forEach(function (g) {
        if (!reduceMotion) { g.x += g.vx; if (g.x > w+5) g.x = -5; }
        var tw = reduceMotion ? 0.5 : (Math.sin(time/1100+g.phase)*0.35+0.5) * intro;
        ctx.fillStyle = "rgba(255,180,110," + (tw*0.4) + ")";
        ctx.beginPath(); ctx.arc(g.x, g.y, g.s, 0, Math.PI*2); ctx.fill();
      });
    }

    revealController("ringSect", "ringText", { draw: draw });
  })();
})();
</script>
</body>
</html>
